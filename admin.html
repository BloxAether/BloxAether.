<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxAether | Painel de Controle Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030611;
            --card-bg: rgba(9, 19, 38, 0.9);
            --main-neon: #00f3ff;
            --main-glow: rgba(0, 243, 255, 0.4);
            --blue-accent: #0066ff;
            --text-light: #e6f9ff;
            --text-muted: #6b829d;
            --sold-out: #ff2a6d;
            --available: #00ffaa;
            --border-glow: rgba(0, 243, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            padding: 30px 20px;
            background-image: 
                radial-gradient(circle at 50% 0%, var(--main-glow) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px var(--main-glow);
        }

        .logo { font-family: 'Orbitron'; font-size: 1.8rem; color: #fff; }
        .logo span { color: var(--main-neon); }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .card-title {
            font-family: 'Orbitron';
            color: var(--main-neon);
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group { margin-bottom: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        input, select, textarea {
            width: 100%;
            background: rgba(3, 6, 17, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--main-neon);
            box-shadow: 0 0 10px var(--main-neon);
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--main-neon);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron';
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }

        .btn-action:hover {
            box-shadow: 0 0 15px var(--main-neon);
            background: #fff;
        }

        .btn-danger {
            background: var(--sold-out);
            color: #fff;
        }

        .btn-danger:hover {
            box-shadow: 0 0 15px var(--sold-out);
            background: #ff5c8d;
        }

        /* Tabela de Produtos */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 0.95rem;
        }

        th {
            font-family: 'Orbitron';
            color: var(--main-neon);
            background: rgba(0,0,0,0.3);
        }

        .badge-stock {
            background: rgba(0, 102, 255, 0.2);
            color: var(--main-neon);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-family: 'Orbitron';
            border: 1px solid var(--blue-accent);
        }

        .btn-del {
            background: transparent;
            border: 1px solid var(--sold-out);
            color: var(--sold-out);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-del:hover {
            background: var(--sold-out);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">Blox<span>Aether</span> Control Center</div>
            <div style="font-family:'Orbitron'; color:var(--available);">🟢 ADMIN CONECTADO</div>
        </header>

        <div class="dashboard-grid">
            <!-- Formulário: Adicionar Nova Conta -->
            <div class="admin-card">
                <div class="card-title">➕ Adicionar Conta ao Estoque</div>
                <form onsubmit="saveProduct(event)">
                    <div class="form-group">
                        <input type="text" id="pTitle" placeholder="Título da Conta (ex: CONTA #06 - Buddha V2)" required>
                    </div>
                    <div class="form-row form-group">
                        <select id="pSea" required>
                            <option value="Sea 1">Sea 1</option>
                            <option value="Sea 2">Sea 2</option>
                            <option value="Sea 3">Sea 3</option>
                        </select>
                        <input type="number" id="pLevel" placeholder="Nível (ex: 2650)" required>
                    </div>
                    <div class="form-row form-group">
                        <input type="number" step="0.01" id="pPrice" placeholder="Preço R$" required>
                        <input type="number" id="pStock" placeholder="Estoque (Qtd)" value="1" required>
                    </div>
                    <div class="form-group">
                        <textarea id="pDesc" rows="3" placeholder="Descrição dos itens, espadas e frutas..." required></textarea>
                    </div>
                    <button type="submit" class="btn-action">💾 Salvar Conta no Catálogo</button>
                </form>
            </div>

            <!-- Formulário: Alerta Global & Controles -->
            <div class="admin-card" style="display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                    <div class="card-title">📢 Enviar Aviso para a Loja</div>
                    <div class="form-group">
                        <input type="text" id="alertInput" placeholder="Ex: PROMOÇÃO! Use o cupom AETHER10">
                    </div>
                    <button onclick="setAlert()" class="btn-action" style="margin-bottom: 20px;">📢 Publicar Alerta Topo da Loja</button>
                    <button onclick="clearAlert()" class="btn-action" style="background: transparent; border: 1px solid var(--text-muted); color: var(--text-muted);">✕ Remover Aviso</button>
                </div>

                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
                    <div class="card-title" style="color:var(--sold-out);">⚠️ Zona de Perigo</div>
                    <button onclick="resetData()" class="btn-action btn-danger">Resetar Estoque para o Padrão</button>
                </div>
            </div>
        </div>

        <!-- Tabela: Gerenciamento do Estoque -->
        <div class="admin-card">
            <div class="card-title">📦 Gerenciar Estoque Atual (<span id="totalItems">0</span>)</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Sea</th>
                            <th>Nível</th>
                            <th>Preço</th>
                            <th>Qtd</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, title: "CONTA #00 - Dough V1 + Shark Anchor", sea: "Sea 3", level: 2611, price: 35.00, stock: 3, desc: "Sea 3 desbloqueado, Godhuman, Shark Anchor, Dough V1 maestria máxima.", status: "available" },
            { id: 2, title: "CONTA #04 - Gravity V2 + CDK Craft", sea: "Sea 3", level: 2650, price: 28.00, stock: 1, desc: "Sea 3 desbloqueado, Nível Máximo 2650, Cursed Dual Katana e Soul Guitar.", status: "available" },
            { id: 3, title: "CONTA #01 - Starter Sea 2 + Shizu", sea: "Sea 2", level: 1745, price: 15.00, stock: 5, desc: "Sea 2 desbloqueado, espada Shizu e frutas no inventário.", status: "available" },
            { id: 4, title: "CONTA #05 - Light All Skills + Angel V2", sea: "Sea 2", level: 1212, price: 12.00, stock: 2, desc: "Sea 2 com Light awaken e Raça Angel V2 habilitada.", status: "available" }
        ];

        function getProducts() {
            return JSON.parse(localStorage.getItem('app_products_v3')) || defaultProducts;
        }

        function renderTable() {
            const products = getProducts();
            const table = document.getElementById('inventoryTable');
            document.getElementById('totalItems').innerText = products.length;

            table.innerHTML = '';
            products.forEach(p => {
                table.innerHTML += `
                    <tr>
                        <td><strong>${p.title}</strong></td>
                        <td>${p.sea}</td>
                        <td>${p.level}</td>
                        <td style="color:var(--main-neon); font-family:'Orbitron';">R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}</td>
                        <td><span class="badge-stock">${p.stock || 0} un</span></td>
                        <td><button class="btn-del" onclick="deleteProduct(${p.id})">Excluir</button></td>
                    </tr>
                `;
            });

            // Carregar aviso global existente
            document.getElementById('alertInput').value = localStorage.getItem('app_global_alert') || '';
        }

        function saveProduct(e) {
            e.preventDefault();
            const products = getProducts();

            const newProd = {
                id: Date.now(),
                title: document.getElementById('pTitle').value.trim(),
                sea: document.getElementById('pSea').value,
                level: parseInt(document.getElementById('pLevel').value),
                price: parseFloat(document.getElementById('pPrice').value),
                stock: parseInt(document.getElementById('pStock').value),
                desc: document.getElementById('pDesc').value.trim(),
                status: "available"
            };

            products.unshift(newProd);
            localStorage.setItem('app_products_v3', JSON.stringify(products));

            // Limpar formulário
            document.getElementById('pTitle').value = '';
            document.getElementById('pLevel').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pStock').value = '1';
            document.getElementById('pDesc').value = '';

            renderTable();
            alert("Conta cadastrada com sucesso! Ela já está visível na loja.");
        }

        function deleteProduct(id) {
            if (confirm("Deseja realmente remover esta conta do estoque?")) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                localStorage.setItem('app_products_v3', JSON.stringify(products));
                renderTable();
            }
        }

        function setAlert() {
            const val = document.getElementById('alertInput').value.trim();
            localStorage.setItem('app_global_alert', val);
            alert("Alerta publicado na loja!");
        }

        function clearAlert() {
            localStorage.removeItem('app_global_alert');
            document.getElementById('alertInput').value = '';
            alert("Alerta removido!");
        }

        function resetData() {
            if (confirm("Deseja restaurar as contas padrão?")) {
                localStorage.removeItem('app_products_v3');
                renderTable();
            }
        }

        window.onload = renderTable;
    </script>
</body>
</html>
