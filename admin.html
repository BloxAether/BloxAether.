<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxAether | Painel Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030611;
            --card-bg: rgba(9, 19, 38, 0.9);
            --main-neon: #00f3ff;
            --main-glow: rgba(0, 243, 255, 0.4);
            --text-light: #e6f9ff;
            --sold-out: #ff2a6d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            padding: 30px 20px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: var(--card-bg); border: 1px solid var(--main-neon);
            border-radius: 12px; margin-bottom: 30px; box-shadow: 0 0 15px var(--main-glow);
        }

        .logo { font-family: 'Orbitron'; font-size: 1.8rem; }
        .logo span { color: var(--main-neon); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

        .card { background: var(--card-bg); border: 1px solid rgba(0,243,255,0.3); border-radius: 12px; padding: 20px; }
        .card-title { font-family: 'Orbitron'; color: var(--main-neon); font-size: 1.2rem; margin-bottom: 15px; }

        input, select, textarea {
            width: 100%; background: #000; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px; padding: 10px; color: #fff; margin-bottom: 10px; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--main-neon); }

        .btn {
            width: 100%; padding: 12px; background: var(--main-neon); color: #000;
            border: none; border-radius: 8px; font-family: 'Orbitron'; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 15px var(--main-neon); }
        .btn-red { background: var(--sold-out); color: #fff; }
        .btn-red:hover { box-shadow: 0 0 15px var(--sold-out); }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { font-family: 'Orbitron'; color: var(--main-neon); }
        
        .stock-btn { background: transparent; border: 1px solid #fff; color: #fff; cursor: pointer; padding: 2px 8px; border-radius: 4px; }
        .stock-btn:hover { background: #fff; color: #000; }
        .action-btn { background: transparent; border: 1px solid #fff; color: #fff; cursor: pointer; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">Blox<span>Aether</span> Admin</div>
            <div style="font-family:'Orbitron'; color:#00ffaa;">🟢 SISTEMA ATIVO</div>
        </header>

        <div class="grid">
            <!-- Adicionar / Editar Conta -->
            <div class="card">
                <div class="card-title" id="formTitle">➕ Adicionar Nova Conta</div>
                <form onsubmit="saveProduct(event)">
                    <input type="hidden" id="pId">
                    <input type="text" id="pTitle" placeholder="Título da Conta (ex: Godhuman + CDK)" required>
                    <div style="display: flex; gap: 10px;">
                        <select id="pSea" required>
                            <option value="Sea 1">Sea 1</option>
                            <option value="Sea 2">Sea 2</option>
                            <option value="Sea 3">Sea 3</option>
                        </select>
                        <input type="number" id="pLevel" placeholder="Nível (ex: 2550)" required>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" step="0.01" id="pPrice" placeholder="Preço R$" required>
                        <input type="number" id="pStock" placeholder="Qtd Estoque" value="1" required>
                    </div>
                    <textarea id="pDesc" rows="4" placeholder="Descrição completa (Itens, frutas, espadas...)" required></textarea>
                    
                    <button type="submit" class="btn" id="btnSalvar">💾 Salvar Conta</button>
                    <button type="button" class="btn btn-red" style="display:none; margin-top:10px;" id="btnCancelar" onclick="cancelEdit()">Cancelar Edição</button>
                </form>
            </div>

            <!-- Avisos e Ferramentas -->
            <div class="card">
                <div class="card-title">📢 Aviso Global na Loja</div>
                <input type="text" id="alertInput" placeholder="Digite um aviso (Promoção, Manutenção...)">
                <button onclick="setAlert()" class="btn" style="margin-bottom: 10px;">Publicar Aviso</button>
                <button onclick="clearAlert()" class="btn" style="background: transparent; border: 1px solid #fff; color:#fff;">Remover Aviso</button>
                
                <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">
                
                <div class="card-title" style="color: var(--sold-out);">⚠️ Reset de Dados</div>
                <button onclick="resetData()" class="btn btn-red">Apagar Tudo e Resetar</button>
            </div>
        </div>

        <!-- Tabela de Estoque -->
        <div class="card" style="overflow-x: auto;">
            <div class="card-title">📦 Gerenciar Estoque Atual (<span id="totalItems">0</span>)</div>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Nível</th>
                        <th>Preço</th>
                        <th>Estoque (Qtd)</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="inventoryTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Dados Padrão Iniciais
        const defaultProducts = [
            { id: 1700000000001, title: "CONTA #00 - Dough V1 + Shark Anchor", sea: "Sea 3", level: 2611, price: 35.00, stock: 3, desc: "Sea 3 desbloqueado\nGodhuman\nShark Anchor\nDough V1 maestria máxima." },
            { id: 1700000000002, title: "CONTA #04 - Gravity V2 + CDK", sea: "Sea 3", level: 2650, price: 28.00, stock: 1, desc: "Nível Máximo 2650\nCursed Dual Katana\nSoul Guitar." }
        ];

        function getProducts() {
            let data = localStorage.getItem('app_products_v3');
            if (!data) {
                localStorage.setItem('app_products_v3', JSON.stringify(defaultProducts));
                return defaultProducts;
            }
            return JSON.parse(data);
        }

        function renderTable() {
            const products = getProducts();
            const table = document.getElementById('inventoryTable');
            document.getElementById('totalItems').innerText = products.length;
            table.innerHTML = '';

            products.forEach(p => {
                table.innerHTML += `
                    <tr>
                        <td><strong>${p.title}</strong></td>
                        <td>${p.level}</td>
                        <td style="color:var(--main-neon);">R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}</td>
                        <td>
                            <button class="stock-btn" onclick="updateStock(${p.id}, -1)">-</button>
                            <span style="margin: 0 10px; font-weight:bold;">${p.stock}</span>
                            <button class="stock-btn" onclick="updateStock(${p.id}, 1)">+</button>
                        </td>
                        <td>
                            <button class="action-btn" style="border-color:var(--main-neon); color:var(--main-neon);" onclick="editProduct(${p.id})">Editar</button>
                            <button class="action-btn" style="border-color:var(--sold-out); color:var(--sold-out);" onclick="deleteProduct(${p.id})">Apagar</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('alertInput').value = localStorage.getItem('app_global_alert') || '';
        }

        function saveProduct(e) {
            e.preventDefault();
            let products = getProducts();
            const idToEdit = document.getElementById('pId').value;

            const newProd = {
                id: idToEdit ? parseInt(idToEdit) : Date.now(),
                title: document.getElementById('pTitle').value.trim(),
                sea: document.getElementById('pSea').value,
                level: parseInt(document.getElementById('pLevel').value),
                price: parseFloat(document.getElementById('pPrice').value),
                stock: parseInt(document.getElementById('pStock').value),
                desc: document.getElementById('pDesc').value.trim()
            };

            if (idToEdit) {
                // Atualizando existente
                const index = products.findIndex(p => p.id == idToEdit);
                if(index > -1) products[index] = newProd;
                alert("Conta atualizada com sucesso!");
            } else {
                // Criando nova
                products.unshift(newProd);
                alert("Conta cadastrada e visível na loja!");
            }

            localStorage.setItem('app_products_v3', JSON.stringify(products));
            cancelEdit();
            renderTable();
        }

        function editProduct(id) {
            const products = getProducts();
            const p = products.find(x => x.id === id);
            if (p) {
                document.getElementById('formTitle').innerText = "✏️ Editando Conta";
                document.getElementById('pId').value = p.id;
                document.getElementById('pTitle').value = p.title;
                document.getElementById('pSea').value = p.sea;
                document.getElementById('pLevel').value = p.level;
                document.getElementById('pPrice').value = p.price;
                document.getElementById('pStock').value = p.stock;
                document.getElementById('pDesc').value = p.desc;
                
                document.getElementById('btnSalvar').innerText = "💾 Atualizar Conta";
                document.getElementById('btnCancelar').style.display = "block";
            }
        }

        function cancelEdit() {
            document.getElementById('formTitle').innerText = "➕ Adicionar Nova Conta";
            document.getElementById('pId').value = '';
            document.getElementById('pTitle').value = '';
            document.getElementById('pLevel').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pStock').value = '1';
            document.getElementById('pDesc').value = '';
            
            document.getElementById('btnSalvar').innerText = "💾 Salvar Conta";
            document.getElementById('btnCancelar').style.display = "none";
        }

        function updateStock(id, change) {
            let products = getProducts();
            let p = products.find(x => x.id === id);
            if (p) {
                p.stock += change;
                if (p.stock < 0) p.stock = 0;
                localStorage.setItem('app_products_v3', JSON.stringify(products));
                renderTable();
            }
        }

        function deleteProduct(id) {
            if (confirm("Deletar esta conta da loja?")) {
                let products = getProducts();
                products = products.filter(p => p.id !== id);
                localStorage.setItem('app_products_v3', JSON.stringify(products));
                renderTable();
            }
        }

        function setAlert() {
            const text = document.getElementById('alertInput').value;
            localStorage.setItem('app_global_alert', text);
            alert("Aviso salvo na loja!");
        }

        function clearAlert() {
            localStorage.removeItem('app_global_alert');
            document.getElementById('alertInput').value = '';
            alert("Aviso removido!");
        }

        function resetData() {
            if (confirm("⚠️ TEM CERTEZA? Isso vai apagar todas as contas e voltar ao padrão!")) {
                localStorage.removeItem('app_products_v3');
                renderTable();
            }
        }

        window.onload = renderTable;
    </script>
</body>
</html>
