<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxAether | Mercado Cyber Blox Fruits</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030611;
            --card-bg: rgba(9, 19, 38, 0.9);
            --main-neon: #a200ff; /* Roxo Neon */
            --main-glow: rgba(162, 0, 255, 0.4);
            --text-light: #e6f9ff;
            --text-muted: #8b9bb4;
            --available: #00ffaa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }

        body {
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            /* Fundo corrigido para não sobrepor nada */
            background-image: radial-gradient(circle at 50% 0%, var(--main-glow) 0%, transparent 50%);
            background-size: 100% 100%;
            background-attachment: fixed;
            padding-bottom: 50px;
        }

        /* Alerta Global Consertado */
        #globalAlertBanner {
            display: none;
            background: var(--main-neon);
            color: #fff;
            text-align: center;
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            box-shadow: 0 0 15px var(--main-glow);
            position: relative;
            z-index: 1000;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo { font-family: 'Orbitron'; font-size: 2rem; color: #fff; }
        .logo span { color: var(--main-neon); text-shadow: 0 0 10px var(--main-glow); }

        .header-btn {
            background: transparent;
            border: 1px solid var(--main-neon);
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .header-btn:hover { background: var(--main-neon); box-shadow: 0 0 10px var(--main-glow); }

        /* Filtros */
        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .filters input, .filters select {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(162, 0, 255, 0.5);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            flex: 1;
            min-width: 200px;
        }

        /* Grid de Produtos */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid rgba(162, 0, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            border-color: var(--main-neon);
            box-shadow: 0 0 15px var(--main-glow);
            transform: translateY(-5px);
        }

        .status-badge {
            background: rgba(0, 255, 170, 0.1);
            color: var(--available);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid var(--available);
            display: inline-block;
            margin-bottom: 10px;
            font-family: 'Orbitron';
        }

        .product-title { font-family: 'Orbitron'; font-size: 1.1rem; margin-bottom: 10px; line-height: 1.4; }
        .product-level { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
        .product-price { font-family: 'Orbitron'; color: var(--main-neon); font-size: 1.5rem; }

        /* Modais Consertados (Sem sobrepor texto) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid var(--main-neon);
            box-shadow: 0 0 30px var(--main-glow);
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            position: relative;
            max-height: 90vh; /* Impede que passe da tela */
            overflow-y: auto; /* Adiciona rolagem se tiver muito texto */
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .btn-buy {
            width: 100%;
            padding: 15px;
            background: var(--main-neon);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Orbitron';
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-buy:hover { box-shadow: 0 0 20px var(--main-neon); }

        /* Chat do Suporte */
        .chat-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg { max-width: 80%; padding: 10px; border-radius: 8px; }
        .msg.bot { background: rgba(162, 0, 255, 0.2); border: 1px solid var(--main-neon); align-self: flex-start; }
        .msg.user { background: rgba(255,255,255,0.1); align-self: flex-end; }
        
        .chat-input { display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--main-neon); background: #000; color: #fff; }
        .chat-input button { padding: 10px 20px; background: var(--main-neon); color: #fff; border: none; border-radius: 8px; cursor: pointer; }

    </style>
</head>
<body>

    <!-- Aviso Global no Topo Corrigido -->
    <div id="globalAlertBanner"></div>

    <div class="container">
        <header>
            <div class="logo">Blox<span>Aether</span></div>
            <div>
                <button class="header-btn" onclick="document.getElementById('supportModal').style.display='flex'">🎧 Suporte</button>
            </div>
        </header>

        <div style="text-align: center; margin-bottom: 40px;">
            <h1 style="font-family: 'Orbitron'; font-size: 2.5rem; margin-bottom: 10px;">Mercado Cyber Blox Fruits</h1>
            <p style="color: var(--text-muted);">Entrega ultra-rápida, sistema seguro e suporte inteligente 24/7.</p>
        </div>

        <!-- Filtros Corrigidos -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Buscar por nome, fruta ou item..." onkeyup="filterProducts()">
            <select id="seaFilter" onchange="filterProducts()">
                <option value="all">🌍 Todos os Seas</option>
                <option value="Sea 1">Sea 1</option>
                <option value="Sea 2">Sea 2</option>
                <option value="Sea 3">Sea 3</option>
            </select>
        </div>

        <h3 style="font-family: 'Orbitron'; margin-bottom: 20px;">🎮 Contas Disponíveis</h3>
        <div class="product-grid" id="productGrid">
            <!-- Produtos renderizados pelo JS -->
        </div>
    </div>

    <!-- Modal do Produto -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('productModal').style.display='none'">✕</button>
            <div class="status-badge" style="margin-top: 10px;">DISPONÍVEL</div>
            <h2 id="modalTitle" class="product-title" style="font-size: 1.5rem;"></h2>
            <p id="modalLevel" class="product-level" style="margin-bottom: 5px;"></p>
            <p id="modalSea" class="product-level" style="color: #fff; font-weight: bold;"></p>
            
            <div style="background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; margin: 15px 0; border: 1px solid rgba(255,255,255,0.1);">
                <h4 style="font-family: 'Orbitron'; margin-bottom: 10px; color: var(--main-neon);">📄 Descrição da Conta:</h4>
                <p id="modalDesc" style="color: #ccc; line-height: 1.5; white-space: pre-wrap;"></p>
            </div>

            <h2 id="modalPrice" class="product-price"></h2>
            <button class="btn-buy" onclick="alert('Função de checkout será integrada ao gateway de pagamento.')">🛒 Comprar Agora</button>
        </div>
    </div>

    <!-- Modal de Suporte -->
    <div class="modal-overlay" id="supportModal">
        <div class="modal-content">
            <button class="close-btn" onclick="document.getElementById('supportModal').style.display='none'">✕</button>
            <h2 style="font-family: 'Orbitron'; margin-bottom: 20px; color: var(--main-neon);">🎧 Central de Suporte</h2>
            
            <button style="width: 100%; padding: 10px; background: #00ffaa; color: #000; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 15px; cursor: pointer;">
                Falar com Humano (WhatsApp)
            </button>

            <div class="chat-box" id="chatBox">
                <div class="msg bot">Olá! Sou o AetherBot. Como posso te ajudar hoje? (Ex: Pix, Entrega, Contas)</div>
            </div>
            
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Digite sua dúvida..." onkeypress="if(event.key === 'Enter') sendMsg()">
                <button onclick="sendMsg()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Puxar produtos do banco (localStorage)
        function getProducts() {
            return JSON.parse(localStorage.getItem('app_products_v3')) || [];
        }

        // Renderizar Produtos
        function renderProducts(productsToRender) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if (productsToRender.length === 0) {
                grid.innerHTML = '<p style="color: gray;">Nenhuma conta encontrada com esses filtros.</p>';
                return;
            }

            productsToRender.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="openModal(${p.id})">
                        <div>
                            <div class="status-badge">${p.stock > 0 ? 'DISPONÍVEL (' + p.stock + ')' : 'ESGOTADO'}</div>
                            <h3 class="product-title">${p.title}</h3>
                            <p class="product-level">Nível: ${p.level} | ${p.sea}</p>
                        </div>
                        <div class="product-price">R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}</div>
                    </div>
                `;
            });
        }

        // Filtro de Texto e Sea Funcionando Juntos
        function filterProducts() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const seaSelect = document.getElementById('seaFilter').value;
            let products = getProducts();

            const filtered = products.filter(p => {
                const matchText = p.title.toLowerCase().includes(searchText) || (p.desc && p.desc.toLowerCase().includes(searchText));
                const matchSea = seaSelect === 'all' || p.sea === seaSelect;
                return matchText && matchSea;
            });

            renderProducts(filtered);
        }

        // Abrir modal carregando todas as informações (Sem undefined)
        function openModal(id) {
            const products = getProducts();
            const p = products.find(x => x.id === id);
            
            if (p) {
                document.getElementById('modalTitle').innerText = p.title;
                document.getElementById('modalLevel').innerText = `Nível da Conta: ${p.level}`;
                document.getElementById('modalSea').innerText = `Mundo: ${p.sea}`;
                document.getElementById('modalDesc').innerText = p.desc ? p.desc : "Nenhuma descrição fornecida pelo administrador.";
                document.getElementById('modalPrice').innerText = `R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}`;
                
                document.getElementById('productModal').style.display = 'flex';
            }
        }

        // Checar Alerta Global
        function checkAlert() {
            const alertText = localStorage.getItem('app_global_alert');
            const banner = document.getElementById('globalAlertBanner');
            if (alertText && alertText.trim() !== '') {
                banner.innerText = alertText;
                banner.style.display = 'block';
            } else {
                banner.style.display = 'none';
            }
        }

        // Bot de Suporte Inteligente
        function sendMsg() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                let response = "Desculpe, não entendi. Tente usar palavras como 'pagamento', 'entrega' ou clique no botão de Suporte Humano.";
                let t = text.toLowerCase();
                
                if (t.includes("oi") || t.includes("ola") || t.includes("opa")) response = "Olá! Em que posso ajudar?";
                else if (t.includes("pix") || t.includes("pagar") || t.includes("cartão") || t.includes("forma de pagamento")) response = "Aceitamos Pix! O pagamento é imediato e a conta é liberada na hora.";
                else if (t.includes("entrega") || t.includes("receber") || t.includes("demora")) response = "Nossa entrega é 100% automática! Assim que o Pix for aprovado, o login e senha aparecem na sua tela.";
                else if (t.includes("confiavel") || t.includes("golpe") || t.includes("seguro")) response = "Somos uma plataforma automatizada. O sistema retém o valor até você receber a conta. É 100% seguro.";
                else if (t.includes("estoque") || t.includes("tem a conta") || t.includes("disponivel")) response = "Se a conta está aparecendo na loja com a tag verde, ela está em estoque e pronta para entrega!";

                chatBox.innerHTML += `<div class="msg bot">${response}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 800);
        }

        // Iniciar
        window.onload = () => {
            checkAlert();
            renderProducts(getProducts());
        };
    </script>
</body>
</html>
