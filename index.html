<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxAether | Mercado de Contas Blox Fruits</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070312;
            --card-bg: #120924;
            --purple-glow: #b026ff;
            --purple-main: #8a2be2;
            --accent-cyan: #00f3ff;
            --text-light: #e0d6ff;
            --text-muted: #a093c4;
            --sold-out: #ff2a6d;
            --available: #00ff87;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Rajdhani', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-light); min-height: 100vh; padding: 20px; }

        .container { max-width: 1200px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(176,38,255,0.2); margin-bottom: 25px; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; color: #fff; text-shadow: 0 0 10px var(--purple-glow); }
        .nav-links { display: flex; gap: 15px; align-items: center; }
        .nav-links a, .nav-btn { color: var(--text-light); text-decoration: none; font-weight: bold; font-size: 0.95rem; cursor: pointer; background: transparent; border: 1px solid transparent; padding: 6px 12px; border-radius: 6px; transition: 0.3s; }
        .nav-links a:hover, .nav-btn:hover { color: var(--accent-cyan); }
        .btn-theme { border: 1px solid var(--accent-cyan); color: var(--accent-cyan); }
        .btn-cart { border: 1px solid var(--purple-glow); background: rgba(176,38,255,0.1); }

        .alert-banner { background: rgba(176,38,255,0.15); border: 1px solid var(--purple-glow); color: #fff; text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 25px; font-weight: bold; font-family: 'Orbitron'; display: none; }

        .hero { text-align: center; margin-bottom: 30px; }
        .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; text-shadow: 0 0 15px var(--purple-glow); margin-bottom: 5px; }
        .hero p { color: var(--text-muted); }

        .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .filter-input, .filter-select { background: #0a0518; border: 1px solid rgba(176,38,255,0.4); border-radius: 6px; padding: 10px 15px; color: #fff; font-size: 0.95rem; outline: none; }
        .filter-input:focus, .filter-select:focus { border-color: var(--accent-cyan); box-shadow: 0 0 8px var(--accent-cyan); }

        .section-title { font-family: 'Orbitron'; font-size: 1.4rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .product-card { background: var(--card-bg); border: 1px solid rgba(138,43,226,0.3); border-radius: 10px; padding: 20px; position: relative; transition: 0.3s; display: flex; flex-direction: column; justify-content: space-between; min-height: 220px; }
        .product-card:hover { border-color: var(--purple-glow); box-shadow: 0 0 15px rgba(176,38,255,0.3); }

        .badge-status { position: absolute; top: 15px; right: 15px; font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-family: 'Orbitron'; font-weight: bold; }
        .status-available { background: rgba(0,255,135,0.15); color: var(--available); border: 1px solid var(--available); }
        .status-sold { background: rgba(255,42,109,0.15); color: var(--sold-out); border: 1px solid var(--sold-out); }

        .product-title { font-family: 'Orbitron'; font-size: 1.1rem; margin-top: 15px; margin-bottom: 10px; color: #fff; width: 80%; }
        .product-level { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 15px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .product-price { font-family: 'Orbitron'; font-size: 1.4rem; color: var(--text-light); }
        .btn-fav { background: transparent; border: none; color: var(--purple-glow); cursor: pointer; font-size: 1.2rem; transition: transform 0.2s; }
        .btn-fav.active { color: #ff2a6d; transform: scale(1.2); }

        .reviews-section { background: var(--card-bg); border: 1px solid rgba(138,43,226,0.3); border-radius: 10px; padding: 25px; margin-bottom: 40px; }
        .reviews-list { color: var(--text-muted); font-style: italic; margin-bottom: 20px; }
        .review-form { display: flex; flex-direction: column; gap: 12px; }
        .review-input, .review-textarea { background: #0a0518; border: 1px solid rgba(176,38,255,0.4); border-radius: 6px; padding: 10px; color: #fff; font-size: 0.95rem; }
        .btn-submit-review { width: fit-content; padding: 10px 20px; background: var(--purple-main); border: none; color: #fff; font-family: 'Orbitron'; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">BloxAether</div>
            <div class="nav-links">
                <a href="#" onclick="renderStore()">🎮 Todas as Contas</a>
                <a href="#" onclick="showFavorites()">❤️ Favoritados (<span id="favCount">0</span>)</a>
                <a href="#" onclick="alert('Suporte via Discord ou WhatsApp ativo!')">🎧 Suporte</a>
                <button class="nav-btn btn-theme" onclick="alert('Alternar Tema')">🎨 Tema</button>
                <button class="nav-btn btn-cart" onclick="alert('Seu carrinho está vazio!')">🛒 Carrinho (0)</button>
            </div>
        </header>

        <div id="globalAlert" class="alert-banner"></div>

        <div class="hero">
            <h1>Mercado de Contas Blox Fruits</h1>
            <p>Segurança, entrega imediata e suporte dedicado.</p>
        </div>

        <div class="filter-bar">
            <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Buscar por nome, fruta ou item..." oninput="filterProducts()">
            <select id="seaSelect" class="filter-select" onchange="filterProducts()">
                <option value="">🌊 Todos os Seas</option>
                <option value="Sea 1">Sea 1</option>
                <option value="Sea 2">Sea 2</option>
                <option value="Sea 3">Sea 3</option>
            </select>
            <select id="priceSelect" class="filter-select" onchange="filterProducts()">
                <option value="">💰 Qualquer Preço</option>
                <option value="15">Até R$ 15</option>
                <option value="30">Até R$ 30</option>
                <option value="50">Até R$ 50</option>
                <option value="100">Até R$ 100</option>
            </select>
        </div>

        <div class="section-title">🎮 Todas as Contas</div>
        <div class="products-grid" id="mainProductsGrid"></div>

        <div class="reviews-section">
            <div class="section-title" style="color: #ffca28;">★ Avaliações dos Clientes</div>
            <div class="reviews-list">Nenhuma avaliação enviada ainda. Seja o primeiro a avaliar!</div>
            
            <form class="review-form" onsubmit="event.preventDefault(); alert('Obrigado pela avaliação!');">
                <div style="color: var(--accent-cyan); font-weight: bold;">Deixe sua avaliação</div>
                <input type="text" class="review-input" placeholder="Seu Nome ou Nick" required>
                <textarea class="review-textarea" rows="3" placeholder="Escreva sobre sua experiência de compra..." required></textarea>
                <button type="submit" class="btn-submit-review">Enviar Avaliação</button>
            </form>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, title: "CONTA #00 - Dough V1 + Shark Anchor", level: 2611, price: 35.00, status: "available" },
            { id: 2, title: "CONTA #04 - Gravity V2 (Craft CDK)", level: 2650, price: 28.00, status: "available" },
            { id: 3, title: "CONTA #01 - Starter Sea 2 + Shizu", level: 1745, price: 15.00, status: "available" },
            { id: 4, title: "CONTA #05 - Light All Skills + Angel V2", level: 1212, price: 12.00, status: "available" }
        ];

        let favorites = JSON.parse(localStorage.getItem('app_favorites')) || [];

        function renderStore(productsToRender) {
            const alertText = localStorage.getItem('app_global_alert');
            const alertEl = document.getElementById('globalAlert');
            if (alertText) {
                alertEl.innerText = alertText;
                alertEl.style.display = 'block';
            } else {
                alertEl.style.display = 'none';
            }

            let products = productsToRender;
            if (!products) {
                products = JSON.parse(localStorage.getItem('app_products_v3'));
                if (!products || !Array.isArray(products) || products.length === 0) {
                    products = defaultProducts;
                }
            }

            const grid = document.getElementById('mainProductsGrid');
            grid.innerHTML = '';

            products.forEach(p => {
                const isAvailable = p.status === 'available';
                const isFav = favorites.includes(p.id);
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <span class="badge-status ${isAvailable ? 'status-available' : 'status-sold'}">
                                ${isAvailable ? 'DISPONÍVEL' : 'ESGOTADO'}
                            </span>
                            <div class="product-title">${p.title}</div>
                            <div class="product-level">Nível: ${p.level}</div>
                        </div>
                        <div class="product-footer">
                            <div class="product-price">R$ ${parseFloat(p.price).toFixed(2).replace('.', ',')}</div>
                            <button class="btn-fav ${isFav ? 'active' : ''}" onclick="toggleFav(${p.id})">♥</button>
                        </div>
                    </div>
                `;
            });

            updateFavCounter();
        }

        function toggleFav(id) {
            const index = favorites.indexOf(id);
            if (index === -1) {
                favorites.push(id);
            } else {
                favorites.splice(index, 1);
            }
            localStorage.setItem('app_favorites', JSON.stringify(favorites));
            filterProducts();
        }

        function updateFavCounter() {
            document.getElementById('favCount').innerText = favorites.length;
        }

        function showFavorites() {
            let products = JSON.parse(localStorage.getItem('app_products_v3')) || defaultProducts;
            const favProducts = products.filter(p => favorites.includes(p.id));
            renderStore(favProducts);
        }

        function filterProducts() {
            let products = JSON.parse(localStorage.getItem('app_products_v3')) || defaultProducts;
            const search = document.getElementById('searchInput').value.toLowerCase();
            const maxPrice = parseFloat(document.getElementById('priceSelect').value);

            const filtered = products.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(search);
                const matchesPrice = isNaN(maxPrice) || p.price <= maxPrice;
                return matchesSearch && matchesPrice;
            });

            renderStore(filtered);
        }

        window.onload = () => renderStore();
    </script>
</body>
</html>
